services:
  inline-chat-server:
    image: inline-chat-server:v1
    container_name: inline-chat-server
    restart: always
    network_mode: host
    environment:
      - APP_HOST=https://inline-chat.moonchan.xyz
      # - ADMIN_PASSWORD=change-me   # 后台管理密码（/ 登录用）；不设则后台禁用
    volumes:
      - ./data:/app/runtime
