services:
  inline-chat-server:
    image: inline-chat-server:v1
    container_name: inline-chat-server
    restart: always
    network_mode: host
    environment:
      - APP_HOST=https://inline-chat.moonchan.xyz
      - ADMIN_PASSWORD=1234Abcd   # 后台管理密码（/ 登录用）；不设则用默认 1234Abcd
    volumes:
      - ./data:/app/runtime
